<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Udaan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeUp { 
      animation: fadeUp .6s ease-out forwards; 
    }
    
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
        radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
      background-repeat: repeat;
      background-size: 200px 100px;
      animation: zoomInOut 3s ease-in-out infinite alternate;
    }
    
    @keyframes zoomInOut {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.2); opacity: 0.4; }
    }
    
    @keyframes float {
      0% { transform: translate(0, 0); }
      50% { transform: translate(10px, 10px); }
      100% { transform: translate(0, 0); }
    }
    
    .floating {
      animation: float 15s infinite ease-in-out;
    }
    
    @keyframes twinkle {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }
    
    .twinkle {
      animation: twinkle 4s infinite;
    }
  </style>
</head>
<body class="relative min-h-screen bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-gray-950 via-[#0a0d21] to-[#020410] flex items-center justify-center p-4 overflow-hidden">
  <div class="stars"></div>
  
  <!-- Space Elements -->
  <div class="absolute top-10 left-10 w-2 h-2 bg-white rounded-full twinkle"></div>
  <div class="absolute top-1/4 right-20 w-1 h-1 bg-blue-300 rounded-full twinkle" style="animation-delay: 1s;"></div>
  <div class="absolute bottom-20 left-1/3 w-1 h-1 bg-purple-300 rounded-full twinkle" style="animation-delay: 2s;"></div>
  <div class="absolute top-1/3 left-1/4 w-1 h-1 bg-cyan-200 rounded-full twinkle" style="animation-delay: 0.5s;"></div>
  <div class="absolute bottom-40 right-1/4 w-2 h-2 bg-white rounded-full twinkle" style="animation-delay: 1.5s;"></div>
  
  <!-- Nebula Blobs -->
  <div class="absolute -top-40 -left-40 w-[500px] h-[500px] rounded-full bg-blue-800/40 mix-blend-screen blur-[100px] floating"></div>
  <div class="absolute bottom-0 right-0 w-[500px] h-[500px] rounded-full bg-purple-800/40 mix-blend-screen blur-[100px] floating" style="animation-delay: 3s;"></div>
  
  <div class="login-card bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl shadow-[0_0_40px_rgba(0,0,0,0.25)] px-10 py-12 w-full max-w-md animate-fadeUp">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white text-center mb-2 tracking-tight">Welcome Back</h1>
      <p class="text-gray-300">Sign in to your student account</p>
    </div>
    
    <form method="POST" class="space-y-5">
      <div>
        <label class="block text-sm text-gray-300 font-medium mb-2">Name</label>
        <input 
          type="text" 
          name="name"
          class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all outline-none"
          placeholder="Enter your name"
          required
        >
      </div>
      
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-sm text-gray-300 font-medium">Password</label>
          <a href="#" class="text-sm text-indigo-400 hover:text-indigo-300">Forgot?</a>
        </div>
        <input 
          type="password" 
          name="password"
          class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all outline-none"
          placeholder="••••••••"
          required
        >
      </div>
      
      <button 
        type="submit" 
        class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-blue-500 text-white font-semibold text-lg hover:scale-[1.02] hover:shadow-lg transition-all"
      >
        Sign In
      </button>
    </form>
    
    <div class="my-6 relative">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-white/10"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-transparent text-gray-400">Or continue with</span>
      </div>
    </div>
    
    <button class="w-full py-3 rounded-xl bg-white/10 border border-white/15 text-white flex items-center justify-center gap-3 hover:bg-white/20 transition-all">
      <i class="fab fa-google text-lg"></i>
      <span>Sign in with Google</span>
    </button>
    
    <a href="{{ url_for('index') }}" class="text-center text-gray-400 hover:text-gray-200 mt-6 block text-sm">
      <i class="fas fa-arrow-left mr-1"></i> Back to home
    </a>
  </div>
</body>
</html>
