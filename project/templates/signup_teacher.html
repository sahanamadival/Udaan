<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Signup - Udaan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeUp { 
      animation: fadeUp .6s ease-out forwards; 
    }
    
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
        radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
      background-repeat: repeat;
      background-size: 200px 100px;
      animation: zoomInOut 3s ease-in-out infinite alternate;
    }
    
    @keyframes zoomInOut {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.2); opacity: 0.4; }
    }
    
    @keyframes float {
      0% { transform: translate(0, 0); }
      50% { transform: translate(10px, 10px); }
      100% { transform: translate(0, 0); }
    }
    
    .floating {
      animation: float 15s infinite ease-in-out;
    }
    
    @keyframes twinkle {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }
    
    .twinkle {
      animation: twinkle 4s infinite;
    }
  </style>
</head>
<body class="relative min-h-screen bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-gray-950 via-[#0a0d21] to-[#020410] flex items-center justify-center p-4 overflow-hidden">
  <div class="stars"></div>
  
  <!-- Space Elements -->
  <div class="absolute top-10 left-10 w-2 h-2 bg-white rounded-full twinkle"></div>
  <div class="absolute top-1/4 right-20 w-1 h-1 bg-blue-300 rounded-full twinkle" style="animation-delay: 1s;"></div>
  <div class="absolute bottom-20 left-1/3 w-1 h-1 bg-purple-300 rounded-full twinkle" style="animation-delay: 2s;"></div>
  <div class="absolute top-1/3 left-1/4 w-1 h-1 bg-cyan-200 rounded-full twinkle" style="animation-delay: 0.5s;"></div>
  <div class="absolute bottom-40 right-1/4 w-2 h-2 bg-white rounded-full twinkle" style="animation-delay: 1.5s;"></div>
  
  <!-- Nebula Blobs -->
  <div class="absolute -top-40 -left-40 w-[500px] h-[500px] rounded-full bg-blue-800/40 mix-blend-screen blur-[100px] floating"></div>
  <div class="absolute bottom-0 right-0 w-[500px] h-[500px] rounded-full bg-purple-800/40 mix-blend-screen blur-[100px] floating" style="animation-delay: 3s;"></div>
  
  <!-- Glassmorphic Card -->
  <div class="max-w-3xl w-full mx-auto p-8 bg-white/10 backdrop-blur-2xl rounded-2xl border border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.45)] relative z-10 animate-fadeUp">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-center mb-2 tracking-tight">Create Account</h1>
      <p class="text-gray-300 text-center">Join Udaan as a teacher or parent</p>
    </div>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-6">
          {% for msg in messages %}
            <div class="bg-red-500/20 border border-red-500/30 text-red-200 px-4 py-2 rounded-lg text-sm">
              {{ msg }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
     
    <form method="POST" class="grid grid-cols-2 gap-5" id="teacherSignupForm">
      <div>
        <label class="block text-sm text-gray-300 font-medium mb-2">First Name *</label>
        <input 
          type="text" 
          name="firstName" 
          id="firstName"
          required
          class="bg-white/5 border border-white/20 rounded-xl p-3 w-full text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
          placeholder="Enter your first name"
        >
      </div>
      
      <div>
        <label class="block text-sm text-gray-300 font-medium mb-2">Last Name *</label>
        <input 
          type="text" 
          name="lastName" 
          id="lastName"
          required
          class="bg-white/5 border border-white/20 rounded-xl p-3 w-full text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
          placeholder="Enter your last name"
        >
      </div>
      
      <div>
        <label class="block text-sm text-gray-300 font-medium mb-2">Email</label>
        <input 
          type="email" 
          name="email" 
          id="email"
          class="bg-white/5 border border-white/20 rounded-xl p-3 w-full text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
          placeholder="teacher@example.com"
        >
      </div>
      
      <div>
        <label class="block text-sm text-gray-300 font-medium mb-2">Phone</label>
        <input 
          type="tel" 
          name="phone" 
          id="phone"
          class="bg-white/5 border border-white/20 rounded-xl p-3 w-full text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
          placeholder="+1 (555) 123-4567"
        >
      </div>
      
      <div>
        <label class="block text-sm text-gray-300 font-medium mb-2">Password *</label>
        <input 
          type="password" 
          name="password" 
          id="password_input_t"
          required
          class="bg-white/5 border border-white/20 rounded-xl p-3 w-full text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
          placeholder="Create a strong password"
        >
      </div>
      
      <div>
        <label class="block text-sm text-gray-300 font-medium mb-2">Confirm Password *</label>
        <input 
          type="password" 
          id="confirmPassword"
          required
          class="bg-white/5 border border-white/20 rounded-xl p-3 w-full text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
          placeholder="Confirm your password"
        >
      </div>
      
      <div class="col-span-2">
        <label class="flex items-center text-gray-300 text-sm">
          <input type="checkbox" id="terms" required class="mr-2 rounded bg-white/5 border-white/20">
          I agree to the <a href="#" class="text-blue-400 hover:text-blue-300">Terms & Privacy Policy</a>
        </label>
      </div>
      
      <input type="hidden" name="name" id="hiddenName">
      
      <div class="col-span-2">
        <button 
          type="submit" 
          class="w-full py-3 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 rounded-xl text-white font-medium shadow-lg hover:scale-[1.02] transition-all"
        >
          Create Account
        </button>
      </div>
    </form>
    
    <div class="mt-6 text-center">
      <a href="{{ url_for('login_teacher') }}" class="text-gray-300 hover:text-white text-sm block mb-2">Already have an account? Login</a>
      <a href="{{ url_for('index') }}" class="text-gray-300 hover:text-white text-sm block">← Back</a>
    </div>
  </div>
  
  <script>
    // Combine first and last name before form submission
    document.getElementById('teacherSignupForm').addEventListener('submit', function(e) {
      const first = document.getElementById('firstName').value.trim();
      const last = document.getElementById('lastName').value.trim();
      const fullName = [first, last].filter(Boolean).join(' ');
      
      if (!fullName) {
        alert('Please enter your name.');
        e.preventDefault();
        return false;
      }
      
      document.getElementById('hiddenName').value = fullName;
      
      const pw = document.getElementById('password_input_t').value;
      const cpw = document.getElementById('confirmPassword').value;
      if(pw !== cpw){
        alert('Passwords do not match.');
        e.preventDefault();
        return false;
      }
      
      if(!document.getElementById('terms').checked){
        alert('Please agree to the Terms & Privacy Policy.');
        e.preventDefault();
        return false;
      }
      
      // Form will submit normally if all validations pass
      return true;
    });
  </script>
</body>
</html>
